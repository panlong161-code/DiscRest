name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys,numpy,scipy; print(sys.version); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
      - name: Test
        run: pytest
