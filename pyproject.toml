[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discrest"
version = "0.8.1"
description = "Local stepwise workbench for reproducible restoration of digitized disc recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Long Pan" }]
keywords = ["audio", "restoration", "declick", "gramophone"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "PyYAML>=6",
]

[project.optional-dependencies]
audition = ["soundfile>=0.12"]
dev = ["pytest>=8", "soundfile>=0.12"]

[project.scripts]
discrest = "discrest.cli:main"

[tool.setuptools.packages.find]
include = ["discrest*"]

[tool.setuptools.package-data]
discrest = ["studio.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
