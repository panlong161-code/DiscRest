[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrest"
version = "0.7.0"
description = "Local stepwise workbench for reproducible restoration of digitized disc recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DiscRest contributors" }]
keywords = ["audio", "restoration", "declick", "gramophone"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discrest = "discrest.cli:main"

[tool.setuptools.packages.find]
include = ["discrest*"]

[tool.setuptools.package-data]
discrest = ["studio.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
